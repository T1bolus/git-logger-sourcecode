services:
  git-logger:
    build:
      context: .
      dockerfile: Dockerfile
    image: git-logger:latest
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      LOG_FILE: /app/logs/git-logger.log
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "8814:8814"
    restart: unless-stopped
    stop_grace_period: 20s
